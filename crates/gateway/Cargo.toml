[package]
name = "mc-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A Minecraft edge gateway: routing, central MOTD and client IP forwarding"

[[bin]]
name = "mc-gateway"
path = "src/main.rs"

[lib]
name = "mc_gateway"
path = "src/lib.rs"

[dependencies]
mc-config = { workspace = true }
mc-forwarding = { workspace = true }
mc-metrics = { workspace = true }
mc-protocol = { workspace = true }
mc-routing = { workspace = true }

arc-swap = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
