[package]
name = "mc-gateway"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Adds a line to the MOTD of every Minecraft server on a hosting node"

[dependencies]
arc-swap = "1.9"
clap = { version = "4.6", features = ["derive", "env"] }
humantime-serde = "1.1"
metrics = "0.24"
# Only the scrape endpoint; the default push-gateway feature pulls in a TLS client.
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["http-listener"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
socket2 = "0.6"
thiserror = "2.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
