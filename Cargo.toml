[workspace]
resolver = "3"
members = [
    "crates/protocol",
    "crates/config",
    "crates/routing",
    "crates/forwarding",
    "crates/gateway",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/InvalidJoker/mc-gateway"

[workspace.dependencies]
mc-protocol = { path = "crates/protocol" }
mc-config = { path = "crates/config" }
mc-routing = { path = "crates/routing" }
mc-forwarding = { path = "crates/forwarding" }

arc-swap = "1.9"
clap = { version = "4.6", features = ["derive", "env"] }
# Status pings, including the pre-1.7 fallback.
craftping = { version = "0.7", default-features = false, features = ["async-tokio"] }
dashmap = "6.2"
# Keyed token buckets with their own garbage collection.
governor = "0.10"
humantime-serde = "1.1"
ipnet = { version = "2.12", features = ["serde"] }
metrics = "0.24"
# `http-listener` brings the scrape endpoint; the default `push-gateway`
# feature would also drag in a TLS client we have no use for.
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["http-listener"] }
proxy-header = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
socket2 = "0.6"
thiserror = "2.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync", "signal"] }
tokio-io-timeout = "1.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
