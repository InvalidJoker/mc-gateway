[workspace]
resolver = "3"
members = [
    "crates/protocol",
    "crates/config",
    "crates/routing",
    "crates/forwarding",
    "crates/metrics",
    "crates/gateway",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/InvalidJoker/mc-gateway"

[workspace.dependencies]
mc-protocol = { path = "crates/protocol" }
mc-config = { path = "crates/config" }
mc-routing = { path = "crates/routing" }
mc-forwarding = { path = "crates/forwarding" }
mc-metrics = { path = "crates/metrics" }

arc-swap = "1.9"
base64 = "0.23"
bytes = "1.12"
clap = { version = "4.6", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
socket2 = "0.6"
thiserror = "2.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
