# mc-gateway — example configuration
#
# The gateway is the only thing exposed to the internet. Backends listen on a
# private network and accept connections from the gateway only.
#
# It is a pass-through proxy: status pings are forwarded to the backend and its
# answer is returned as-is, except for the MOTD lines named below. Everything
# after the handshake is copied byte for byte.

listeners:
  - name: public
    bind: "0.0.0.0:25565"

    # If an L4 load balancer or router sits in front of the gateway and speaks
    # the PROXY protocol, enable this so the real client IP survives that hop.
    # `trusted` is mandatory: without it anyone could claim any source IP.
    proxy_protocol:
      enabled: false
      trusted: ["10.0.0.0/8"]
      required: false

# ---------------------------------------------------------------------------
# Routing: the hostname from the Minecraft handshake decides the backend.
# Forge/NeoForge markers and SRV trailing dots are stripped before matching.
# ---------------------------------------------------------------------------
routing:
  # Used when nothing matches, and for pre-1.7 clients, which send no hostname
  # at all. Remove it to refuse unknown hostnames outright.
  default: survival

  rules:
    - host: "survival.example.net"
      target: survival            # a group — load balanced across its members

    - host: "creative.example.net"
      target: creative-01         # a single server

    - host: "modded.example.net"
      target: modded-01
      motd:                       # per-route MOTD lines
        line2: "&6Modpack v4 required"

    - host: "*.play.example.net"  # any subdomain, and the bare domain too
      target: survival

    - host: "proxy.example.net"   # a Velocity proxy behind the gateway
      target: proxy-01

# ---------------------------------------------------------------------------
# Servers. Add 300 of them here.
#
# There is no forwarding setting: on Linux every backend connection is made
# transparently (TPROXY), so the backend's accept() reports the player's real
# address with no support needed on its side. On other platforms the gateway
# connects normally and the backend sees the gateway. See docs/forwarding.md.
# ---------------------------------------------------------------------------
servers:
  survival-01:
    address: "10.10.1.10:25565"
    group: survival
    kind: paper                   # metadata only: logs and metrics labels
    weight: 1

  survival-02:
    address: "10.10.1.11:25565"
    group: survival
    kind: paper
    weight: 1
    max_connections: 200

  creative-01:
    address: "10.10.1.20:25565"
    kind: paper

  modded-01:
    address: "10.10.2.10:25565"
    kind: neoforge

  proxy-01:
    address: "10.10.3.10:25565"
    kind: velocity

groups:
  survival:
    policy: least_connections     # round_robin | least_connections | failover

# ---------------------------------------------------------------------------
# MOTD.
#
# The backend's own status response is passed through: version, player counts,
# player sample and favicon all come from the server that is actually running.
# The only thing changed is the MOTD text, and only the lines set here.
#
# Leave both unset and the status response is forwarded untouched.
# ---------------------------------------------------------------------------
motd:
  # line1: "&b&lMY NETWORK"       # uncomment to take over the first line too
  line2: "&7survival &8• &7creative &8• &7modded"

  # The one case there is nothing to pass through.
  offline:
    text: "&cCurrently offline &8• &7back soon"
    version_name: "offline"
    max_players: 0
    mark_incompatible: true

messages:
  no_route: "&cUnknown server address"
  backend_offline: "&cThis server is currently offline"
  backend_error: "&cCould not reach the server, please try again"
  rate_limited: "&cToo many connection attempts, slow down"
  too_many_connections: "&cThe network is full, please try again later"

limits:
  max_connections: 20000
  max_connections_per_ip: 8
  connection_rate:
    burst: 30
    per: 60s
  max_handshake_bytes: 8192
  exempt: ["127.0.0.1/32"]

timeouts:
  handshake: 5s
  status: 10s
  connect: 3s
  idle: 10m
  drain: 30s

health:
  enabled: true
  method: status                  # tcp | status
  interval: 10s
  timeout: 2s
  rise: 2
  fall: 3
  start_healthy: true

metrics:
  enabled: true
  bind: "127.0.0.1:9100"

log:
  level: info
  format: text                    # text | json
  client_ip: true
