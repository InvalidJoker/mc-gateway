# mc-gateway on a hosting node. See docs/deployment.md.
#
#   docker compose up -d
#
# Host networking and NET_ADMIN are required: the gateway installs the node's
# firewall rules on start and then runs unprivileged with only that capability.

services:
  mc-gateway:
    image: ghcr.io/invalidjoker/mc-gateway:latest
    # To build from this checkout instead: `build: ..`
    network_mode: host
    cap_add: [NET_ADMIN]
    volumes:
      - ./config.yaml:/etc/mc-gateway/config.yaml:ro
    restart: unless-stopped
