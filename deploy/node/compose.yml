# mc-gateway on a hosting node, as a container.
#
#   docker compose up -d --build
#
# Host networking is required: the gateway has to see and redirect the node's
# own traffic. The container installs the firewall and routing rules on start
# and drops to an unprivileged user that keeps only CAP_NET_ADMIN.
#
# Changing `intercept.ports` or `listen` needs a restart (the rules are
# generated on start); the MOTD line reloads with `docker compose kill -s HUP`.
#
# The image ships iptables-nft. On a host whose firewall still uses
# iptables-legacy, run the gateway with systemd instead (deploy/systemd/), so
# the setup uses the host's own tools.

services:
  mc-gateway:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: mc-gateway:latest
    network_mode: host
    cap_add: [NET_ADMIN]
    volumes:
      - ./config.yaml:/etc/mc-gateway/config.yaml:ro
    restart: unless-stopped
