# A network to test the gateway against real server software.
#
# Only the gateway publishes a port. The backends sit on an internal network,
# exactly as they should in production — which also means this compose file
# fails loudly if the gateway ever stops being the only way in.
#
#   docker compose up -d
#   # then point a client at localhost:25565
#
# ON LINUX, READ THIS FIRST
# -------------------------
# The gateway connects to backends transparently (TPROXY), which needs
# CAP_NET_ADMIN *and* a return path: the backend replies to the player's own IP,
# and those packets have to come back to the gateway. A default docker bridge
# network does not do that, so sessions will hang.
#
# Either give this network the host setup from deploy/nftables/ and make the
# gateway container the backends' default route, or run this compose file on
# macOS/Windows (Docker Desktop), where the gateway connects normally.

name: mc-gateway-test

services:
  gateway:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "25565:25565"
      - "127.0.0.1:9100:9100"
    volumes:
      - ./gateway/config.yaml:/etc/mc-gateway/config.yaml:ro
    # Required on Linux: without it the gateway refuses to start, because it
    # cannot create transparent sockets.
    cap_add: [NET_ADMIN]
    networks: [edge, backend]
    depends_on: [vanilla, paper, velocity]
    restart: unless-stopped

  # Vanilla needs no proxy support of any kind: it is reached either
  # transparently or directly, and sees plain Minecraft bytes either way.
  vanilla:
    image: itzg/minecraft-server:latest
    environment:
      EULA: "TRUE"
      TYPE: VANILLA
      VERSION: "1.21.1"
      ONLINE_MODE: "FALSE"
      MEMORY: 1G
    networks: [backend]
    volumes: [vanilla-data:/data]

  # Paper also needs nothing configured. Leave `proxy-protocol` off in
  # spigot.yml: the gateway sends no header.
  paper:
    image: itzg/minecraft-server:latest
    environment:
      EULA: "TRUE"
      TYPE: PAPER
      VERSION: "1.21.1"
      ONLINE_MODE: "FALSE"
      MEMORY: 1G
    networks: [backend]
    volumes: [paper-data:/data]

  # Velocity behind the gateway: a proxy behind a proxy. Velocity keeps doing
  # its own authentication and its own forwarding to the servers behind it.
  velocity:
    image: itzg/bungeecord:latest
    environment:
      TYPE: VELOCITY
    volumes:
      - ./velocity/velocity.toml:/server/velocity.toml:ro
      - velocity-data:/server
    networks: [backend]

  fabric:
    image: itzg/minecraft-server:latest
    environment:
      EULA: "TRUE"
      TYPE: FABRIC
      VERSION: "1.21.1"
      ONLINE_MODE: "FALSE"
      MEMORY: 1G
    networks: [backend]
    volumes: [fabric-data:/data]
    profiles: [modded]

  neoforge:
    image: itzg/minecraft-server:latest
    environment:
      EULA: "TRUE"
      TYPE: NEOFORGE
      VERSION: "1.21.1"
      ONLINE_MODE: "FALSE"
      MEMORY: 2G
    networks: [backend]
    volumes: [neoforge-data:/data]
    profiles: [modded]

networks:
  edge:
  backend:
    internal: true

volumes:
  vanilla-data:
  paper-data:
  velocity-data:
  fabric-data:
  neoforge-data:
