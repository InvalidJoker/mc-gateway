# A network to test the gateway against real server software.
#
#   docker compose up -d --build
#   # then point a Minecraft client at localhost:25565
#
# Only the gateway publishes a port. Players reach the backends through it and
# nothing else — no backend has a port of its own.
#
# Transparent forwarding in Docker
# --------------------------------
# Containers are Linux on every host (Docker Desktop and OrbStack on macOS
# included), so the gateway always connects to backends transparently and every
# backend sees the player's address. Three things in this file make that work,
# and removing any one of them makes sessions hang:
#
# 1. `cap_add: [NET_ADMIN]` on the gateway. Its entrypoint sets up the return
#    path, then drops to an unprivileged user that keeps only this capability.
#
# 2. The `players` network has masquerading switched off. Docker otherwise
#    rewrites any packet with a source from that subnet leaving via another
#    bridge — which is exactly what a transparent connection looks like — and
#    the backend would see a bridge address instead of the player.
#
#    It also has to be the gateway's first interface, which Docker orders by
#    network name: `players` sorts before `servers`. Desktop port forwarders
#    connect to that first address, so from the host you will see the players
#    bridge address (e.g. 192.168.x.1) rather than your LAN IP. A container on
#    the `players` network, or a real remote client, shows its own address.
#
# 3. Each backend runs inside the network namespace of a small `*-net`
#    container, which sets up the return path: replies to gateway-opened
#    connections go back via the gateway, while the backend's own traffic
#    (downloading the server jar, for instance) keeps its normal route.
#
#    The `*-net` container owns the namespace, like a pod. Recreating the
#    Minecraft server therefore keeps the rules; the other way round — a
#    sidecar joining the server's namespace — loses them on every recreate.
#    The `*-net` container also carries the backend's hostname on the network.
#
# test-infra/tproxy-check/ runs the same setup against a tiny echo backend and
# asserts what address the backend saw.

name: mc-gateway-test

# Owns a backend's network namespace and installs its return path.
x-backend-net: &backend-net
  build:
    context: ..
    dockerfile: test-infra/return-path/Dockerfile
  image: mc-gateway-return-path:dev
  cap_add: [NET_ADMIN]
  environment:
    GATEWAY_IP: 10.77.0.2
    LOCAL_SUBNET: 10.77.0.0/24
  restart: unless-stopped

x-minecraft: &minecraft
  image: itzg/minecraft-server:latest
  restart: unless-stopped

services:
  gateway:
    build:
      context: ..
      dockerfile: Dockerfile
    image: mc-gateway:dev
    ports:
      - "25565:25565"
      - "127.0.0.1:9100:9100"
    volumes:
      - ./gateway/config.yaml:/etc/mc-gateway/config.yaml:ro
    cap_add: [NET_ADMIN]
    networks:
      players:
        gw_priority: 1
      servers:
        ipv4_address: 10.77.0.2
    restart: unless-stopped

  # Vanilla needs no proxy support of any kind.
  vanilla-net:
    <<: *backend-net
    networks: { servers: { aliases: [vanilla] } }
  vanilla:
    <<: *minecraft
    network_mode: "service:vanilla-net"
    depends_on: [vanilla-net]
    environment:
      EULA: "TRUE"
      TYPE: VANILLA
      VERSION: "1.21.1"
      ONLINE_MODE: "FALSE"
      MEMORY: 1G
    volumes: [vanilla-data:/data]

  # Paper needs nothing configured either. Leave `proxy-protocol` off in
  # spigot.yml: the gateway sends no header.
  paper-net:
    <<: *backend-net
    networks: { servers: { aliases: [paper] } }
  paper:
    <<: *minecraft
    network_mode: "service:paper-net"
    depends_on: [paper-net]
    environment:
      EULA: "TRUE"
      TYPE: PAPER
      VERSION: "1.21.1"
      ONLINE_MODE: "FALSE"
      MEMORY: 1G
    volumes: [paper-data:/data]

  # Velocity behind the gateway: a proxy behind a proxy. It keeps doing its own
  # authentication and its own forwarding to the servers behind it. Its hop to
  # Paper stays inside the `servers` subnet, so the return path leaves it alone.
  #
  # It runs with its own generated defaults: current builds rewrite any config
  # file in an older format anyway. Those defaults already have
  # `haproxy-protocol` off, which is what the gateway needs. To actually join
  # through it, edit [servers] in the velocity-data volume.
  velocity-net:
    <<: *backend-net
    networks: { servers: { aliases: [velocity] } }
  velocity:
    image: itzg/bungeecord:latest
    network_mode: "service:velocity-net"
    depends_on: [velocity-net]
    environment:
      TYPE: VELOCITY
    volumes: [velocity-data:/server]
    restart: unless-stopped

  fabric-net:
    <<: *backend-net
    networks: { servers: { aliases: [fabric] } }
    profiles: [modded]
  fabric:
    <<: *minecraft
    network_mode: "service:fabric-net"
    depends_on: [fabric-net]
    environment:
      EULA: "TRUE"
      TYPE: FABRIC
      VERSION: "1.21.1"
      ONLINE_MODE: "FALSE"
      MEMORY: 1G
    volumes: [fabric-data:/data]
    profiles: [modded]

  neoforge-net:
    <<: *backend-net
    networks: { servers: { aliases: [neoforge] } }
    profiles: [modded]
  neoforge:
    <<: *minecraft
    network_mode: "service:neoforge-net"
    depends_on: [neoforge-net]
    environment:
      EULA: "TRUE"
      TYPE: NEOFORGE
      VERSION: "1.21.1"
      ONLINE_MODE: "FALSE"
      MEMORY: 2G
    volumes: [neoforge-data:/data]
    profiles: [modded]

networks:
  # Where players arrive. No masquerading — see the header.
  players:
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"

  # Where the backends live. Not `internal`: the server images download their
  # jars on first start. Nothing here publishes a port, so players still cannot
  # reach a backend except through the gateway.
  #
  # Docker hands out dynamic addresses from the start of a subnet, which would
  # race the gateway's fixed 10.77.0.2 whenever a backend starts first. Dynamic
  # addresses therefore come from the upper half only.
  servers:
    ipam:
      config:
        - subnet: 10.77.0.0/24
          ip_range: 10.77.0.128/25

volumes:
  vanilla-data:
  paper-data:
  velocity-data:
  fabric-data:
  neoforge-data:
