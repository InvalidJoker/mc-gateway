# Velocity running behind mc-gateway.
config-version = "2.7"
bind = "0.0.0.0:25577"
motd = "velocity behind the gateway"
show-max-players = 100
online-mode = false
player-info-forwarding-mode = "legacy"

# The gateway sends no PROXY header — on Linux it connects transparently, so
# Velocity already sees the player's real address at the TCP layer. Turning this
# on would make Velocity wait for a header that never arrives.
haproxy-protocol = false

[servers]
lobby = "paper:25565"
try = ["lobby"]

[advanced]
compression-threshold = 256

[query]
enabled = false
