# Gateway configuration for the docker compose test network.

listeners:
  - name: public
    bind: "0.0.0.0:25565"

routing:
  default: paper
  rules:
    - host: "vanilla.localhost"
      target: vanilla
    - host: "paper.localhost"
      target: paper
    - host: "velocity.localhost"
      target: velocity
    - host: "fabric.localhost"
      target: fabric
    - host: "neoforge.localhost"
      target: neoforge

servers:
  vanilla:
    address: "vanilla:25565"
    kind: vanilla
  paper:
    address: "paper:25565"
    kind: paper
  velocity:
    address: "velocity:25565"
    kind: velocity
  fabric:
    address: "fabric:25565"
    kind: fabric
  neoforge:
    address: "neoforge:25565"
    kind: neoforge

# Each backend keeps its own MOTD, player count, version and icon. Only the
# second line is replaced, which is how you tell at a glance that the ping went
# through the gateway and not straight to the server.
motd:
  line2: "&8• &7via mc-gateway"
  offline:
    text: "&cbackend offline"

limits:
  max_connections_per_ip: 0   # everything comes from the docker bridge IP

health:
  method: status
  interval: 10s
  timeout: 3s

metrics:
  enabled: true
  bind: "0.0.0.0:9100"        # published on loopback only by compose

log:
  level: debug
